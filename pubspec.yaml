name: seedling
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  characters: ^1.4.1
  cloud_firestore: ^6.7.1
  device_calendar: ^4.3.3
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  home_widget: ^0.9.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5

# jni 1.0.1 skips applying the Kotlin plugin on AGP 9 but then uses its
# `kotlin { }` extension anyway, so every AGP 9 build fails with
# "Could not find method kotlin()". path_provider_android 2.3.x is what pulls
# jni in; 2.2.x does not. Drop this once jni fixes the guard.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-SemiBoldItalic.ttf
          weight: 600
          style: italic
